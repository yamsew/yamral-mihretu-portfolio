<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Yamral Portfolio</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap" style="padding:45px 0;max-width:850px"><a href="/">← Back to portfolio</a><p class="kicker">PRIVATE ADMIN AREA</p><h1 style="font-size:2.6rem">Admin Panel</h1>
<section id="loginBox" class="panel"><h2>Administrator login</h2><form id="loginForm"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button class="btn primary">Sign in</button><p id="loginStatus" class="status"></p></form></section>
<div id="dashboard" hidden><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px"><h2>Manage projects</h2><button id="logout" class="btn secondary">Log out</button></div><form id="projectForm"><input name="title" placeholder="Project title" maxlength="100" required><input name="category" placeholder="Category" maxlength="60" required><textarea name="description" placeholder="Project description" maxlength="1000" required></textarea><button class="btn primary">Add project</button><p id="projectStatus" class="status"></p></form><div id="adminProjects"></div></div>
<section class="panel"><h2>Contact messages</h2><div id="messages"></div></section></div></main><script src="/admin.js"></script></body></html>
